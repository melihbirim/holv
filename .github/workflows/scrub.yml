name: scrub
# The hosted agent's tooling appends a "Generated by Claude Code" footer with a session link to PR bodies after the
# agent submits, so the agent cannot remove it. This strips any claude.ai session or routine link from PR bodies.
on:
  pull_request:
    types: [opened, edited, reopened]
permissions:
  pull-requests: write
jobs:
  scrub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = pr.body ?? "";
            const lines = body.split("\n").filter((l) => !/claude\.ai\/code|cse_[0-9A-Za-z]{20,}|trig_[0-9A-Za-z]{20,}|session_[0-9A-Za-z]{20,}/.test(l));
            const scrubbed = lines.join("\n").replace(/\n{3,}/g, "\n\n").trim();
            if (scrubbed !== body.trim()) {
              await github.rest.pulls.update({ owner: context.repo.owner, repo: context.repo.repo, pull_number: pr.number, body: scrubbed });
              core.info(`scrubbed PR #${pr.number}`);
            }
